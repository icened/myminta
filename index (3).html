<style>
:root{color-scheme:dark;background:#000}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;font-family:Arial,Helvetica,sans-serif;color:#ffb3d1}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#000;transition:opacity 1.2s;cursor:pointer;text-align:center}
#start.hide{opacity:0;pointer-events:none}
#start .small{font-size:15px;letter-spacing:.2em;opacity:.8;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.2}}
#start .hb{font-size:58px;color:#ff5a96;text-shadow:0 0 24px #ff5a96;animation:hb 1.3s infinite}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
#love{position:fixed;z-index:4;left:12px;right:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;pointer-events:none;opacity:0;transition:opacity .9s;font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#love .it{font-style:italic;color:#ffe6a3;text-shadow:0 0 3px #000,0 0 16px rgba(255,185,70,.75);font-size:clamp(15px,4.4vw,22px);line-height:1.25}
#love .en{margin-top:5px;min-height:15px;font:12px Arial,Helvetica,sans-serif;color:#ffd27a;text-shadow:0 0 3px #000;letter-spacing:.03em;opacity:0;transition:opacity 1s}
#ui{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:0 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px}
#now{font-size:13px;opacity:.85;text-align:center;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{display:flex;gap:12px}
#bar button{width:48px;height:48px;border-radius:50%;border:1px solid #ff7aa8;background:rgba(0,0,0,.6);color:#ff9cc0;font-size:20px;cursor:pointer;padding:0}
#list{width:min(360px,100%);max-height:40vh;overflow:auto;background:rgba(15,0,8,.92);border:1px solid #ff7aa8;border-radius:14px;padding:6px}
#list[hidden]{display:none}
#list div{padding:12px 14px;border-radius:10px;font-size:15px;cursor:pointer}
#list div.on{background:rgba(255,122,168,.22);color:#fff}
</style>

<script>
// ===== SONGS: upload the mp3 next to index.html, then add a line here =====
const SONGS=[
  {t:'Life Of The Party',f:'song1.mp3'},
  // {t:'Rolling Stone',f:'song2.mp3'},
];
// ===== love notes (Italian + English), shown one after another =====
const LOVE=[
  ['Sei la mia stella preferita.','You are my favorite star.'],
  ['Quando ti vedo, il mio cuore dimentica come battere piano.','When I see you, my heart forgets how to beat softly.'],
  ['Mi piaci davvero, Mint. Più di quanto riesca a dire.','I really like you, Mint. More than I can say.'],
  ['Con te anche il silenzio suona come una canzone.','With you even silence sounds like a song.'],
  ['Ti penso più di quanto dovrei, e non mi dispiace affatto.',"I think of you more than I should, and I don't mind at all."],
  ['Sei il mio pensiero più bello.','You are my most beautiful thought.'],
  ['Vorrei essere il tuo posto sicuro.',"I'd like to be your safe place."]
];
// ===== message inside the heart =====
const MSG1='MINT YH', MSG2='MAKES ME HARD';

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const IW=420,IH=512,SW=800,SH=700,CX=400,CY=330;
const NPHOTO=8500,NFILL=2400,NEDGE=2600;
const rnd=Math.random;
let P=[],F=[],E=[],T=[];

// heart outline table + inside test
const HP=[];
for(let i=0;i<720;i++){
  const t=i/720*Math.PI*2;
  const hx=16*Math.pow(Math.sin(t),3);
  const hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  HP.push({x:CX+hx*16.5,y:CY-20-hy*16.5});
}
let hx0=1e9,hx1=-1e9,hy0=1e9,hy1=-1e9;
for(const p of HP){hx0=Math.min(hx0,p.x);hx1=Math.max(hx1,p.x);hy0=Math.min(hy0,p.y);hy1=Math.max(hy1,p.y);}
function inHeart(x,y){
  let ins=false;
  for(let i=0,j=HP.length-1;i<HP.length;j=i++){
    const a=HP[i],b=HP[j];
    if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)ins=!ins;
  }
  return ins;
}
function addLine(txt,cy,size){
  const o=document.createElement('canvas');o.width=SW;o.height=120;
  const c=o.getContext('2d');
  c.fillStyle='#fff';c.font='bold '+size+'px Arial, Helvetica, sans-serif';
  c.textAlign='center';c.textBaseline='middle';c.fillText(txt,SW/2,60);
  const d=c.getImageData(0,0,SW,120).data;
  for(let y=0;y<120;y+=2)for(let x=0;x<SW;x+=2)
    if(d[(y*SW+x)*4+3]>128)T.push({x:rnd()*SW,y:rnd()*SH,bx:x,by:cy-60+y,o:rnd()*6});
}
function build(img){
  // photo dots (blue), soft rectangular fade at the edges
  const o=document.createElement('canvas');o.width=IW;o.height=IH;
  const c=o.getContext('2d');c.drawImage(img,0,0,IW,IH);
  const d=c.getImageData(0,0,IW,IH).data;
  P=[];let g=0;
  while(P.length<NPHOTO&&g++<500000){
    const x=rnd()*IW,y=rnd()*IH;
    const b=d[((y|0)*IW+(x|0))*4]/255;
    const e=Math.min(1,Math.min(x,IW-x,y,IH-y)/45);
    if(rnd()<(.04+.96*Math.pow(b,1.3))*e)
      P.push({x:rnd()*IW,y:rnd()*IH,bx:x,by:y,b,o:rnd()*6,h:rnd()<.15});
  }
  // pink heart: soft fill, travelling outline, message
  for(let i=0;i<NFILL;){
    const x=hx0+rnd()*(hx1-hx0),y=hy0+rnd()*(hy1-hy0);
    if(inHeart(x,y)){F.push({x:rnd()*SW,y:rnd()*SH,bx:x,by:y,o:rnd()*6});i++;}
  }
  for(let i=0;i<NEDGE;i++)
    E.push({x:rnd()*SW,y:rnd()*SH,t:rnd()*720,sp:(rnd()<.5?1:-1)*(.25+rnd()*.5),k:1+(rnd()-.5)*.05,o:rnd()*6,u:rnd()});
  addLine(MSG1,CY-62,46);
  addLine(MSG2,CY-2,40);
}
const im=document.getElementById('src');
if(im.complete)build(im);else im.onload=()=>build(im);

// layout: photo top-right, heart bottom-middle
const loveEl=document.getElementById('love');
let vw=0,vh=0,dpr=1,hs=1,hox=0,hoy=0,ps=1,pox=0,poy=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  vw=innerWidth;vh=innerHeight;
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  const free=vh-110;
  hs=Math.min(vw*.96/(hx1-hx0+30),free*.52/(hy1-hy0));
  hox=vw/2-CX*hs;hoy=free-8-hy1*hs;
  ps=Math.min(vw*.72/IW,free*.43/IH);
  pox=vw-IW*ps-4;poy=6;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,cv.width,cv.height);
  const top=poy+IH*ps-34,bot=hoy+hy0*hs+4;
  loveEl.style.top=top+'px';loveEl.style.height=Math.max(40,bot-top)+'px';
}
addEventListener('resize',resize);resize();

// touch / mouse: dots scatter away from the finger
let sx=-999,sy=-999;
function pointer(e){sx=e.clientX;sy=e.clientY;}
cv.addEventListener('pointerdown',e=>{for(let i=0;i<9;i++)spawnHeart(e.clientX,e.clientY,true);});
function leave(){sx=sy=-999;}
cv.addEventListener('pointermove',pointer);cv.addEventListener('pointerdown',pointer);
cv.addEventListener('pointerup',leave);cv.addEventListener('pointerleave',leave);

// background: faint stars + shooting star
const stars=Array.from({length:90},()=>({x:rnd(),y:rnd(),s:rnd()*1.5+.4,o:rnd()*6}));
const shoots=[];
const sparkles=Array.from({length:26},()=>({x:rnd(),y:rnd(),s:3+rnd()*5,o:rnd()*6}));
const hearts=[];
function miniHeart(x,y,s){
  ctx.beginPath();ctx.moveTo(x,y+s*.35);
  ctx.bezierCurveTo(x-s,y-s*.4,x-s*.5,y-s,x,y-s*.45);
  ctx.bezierCurveTo(x+s*.5,y-s,x+s,y-s*.4,x,y+s*.35);ctx.fill();
}
function spawnHeart(x,y,burst){
  if(hearts.length>110)return;
  hearts.push({x,y,vx:(rnd()-.5)*(burst?3:.6),vy:-(burst?1+rnd()*2.5:.5+rnd()*1.3),s:5+rnd()*(burst?10:13),o:rnd()*6,l:0,hue:rnd()});
}

// audio
const audio=document.getElementById('song');
const now=document.getElementById('now'),pp=document.getElementById('pp'),listEl=document.getElementById('list');
let cur=0,analyser=null,bins=null,energy=0,AC=null;
audio.loop=SONGS.length===1;
function load(i,play){
  cur=(i+SONGS.length)%SONGS.length;
  audio.src=SONGS[cur].f;
  now.textContent=SONGS[cur].t;
  [...listEl.children].forEach((d,k)=>d.classList.toggle('on',k===cur));
  if(play)audio.play().catch(()=>{});
}
SONGS.forEach((s,i)=>{
  const d=document.createElement('div');d.textContent=s.t;
  d.onclick=()=>{load(i,true);listEl.hidden=true;};
  listEl.appendChild(d);
});
load(0,false);
audio.addEventListener('error',()=>{now.textContent='Song file not found: '+SONGS[cur].f;});
audio.addEventListener('ended',()=>{if(SONGS.length>1)load(cur+1,true);});
audio.addEventListener('play',()=>pp.innerHTML='&#10074;&#10074;');
audio.addEventListener('pause',()=>pp.innerHTML='&#9654;&#xFE0E;');
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function setupAudio(){
  if(IOS||/Android|Mobi/i.test(navigator.userAgent))return; // phones: play the file directly (most reliable)
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const src=AC.createMediaElementSource(audio);
    analyser=AC.createAnalyser();analyser.fftSize=256;
    src.connect(analyser);analyser.connect(AC.destination);
    bins=new Uint8Array(analyser.frequencyBinCount);
  }catch(e){analyser=null;}
}
const itEl=loveEl.querySelector('.it'),enEl=loveEl.querySelector('.en');
let li=0,loveOn=false;
function typeLove(){
  const L=LOVE[li];itEl.textContent='';enEl.style.opacity=0;enEl.textContent=L[1];
  loveEl.style.opacity=1;let k=0;
  const iv=setInterval(()=>{
    k++;itEl.textContent=L[0].slice(0,k);
    if(k>=L[0].length){
      clearInterval(iv);enEl.style.opacity=.75;
      setTimeout(()=>{loveEl.style.opacity=0;setTimeout(()=>{li=(li+1)%LOVE.length;typeLove();},1000);},4200);
    }
  },55);
}
let want=false,userPaused=false;
function startSong(){
  want=true;userPaused=false;
  const p=audio.play();                       // first thing inside the tap
  if(p&&p.catch)p.catch(()=>{now.textContent='Tap anywhere to start the song';});
}
document.getElementById('start').addEventListener('click',function(){
  startSong();
  try{if(!AC)setupAudio();if(AC&&AC.state==='suspended')AC.resume();}catch(e){}
  if(!loveOn){loveOn=true;setTimeout(typeLove,1500);}
  this.classList.add('hide');
});
// safety net: if the song didn't start for any reason, the next tap starts it
document.addEventListener('pointerdown',()=>{if(want&&audio.paused&&!userPaused&&!audio.error)audio.play().catch(()=>{});});
audio.addEventListener('waiting',()=>{now.textContent='loading song…';});
audio.addEventListener('playing',()=>{now.textContent=SONGS[cur].t;});
if('mediaSession' in navigator){
  const setMeta=()=>{try{navigator.mediaSession.metadata=new MediaMetadata({title:SONGS[cur].t,artist:'For you'});}catch(e){}};
  audio.addEventListener('play',setMeta);
}
pp.onclick=()=>{if(audio.paused){userPaused=false;audio.play().catch(()=>{});}else{userPaused=true;audio.pause();}};
document.getElementById('prev').onclick=()=>load(cur-1,true);
document.getElementById('next').onclick=()=>load(cur+1,true);
document.getElementById('lst').onclick=()=>{listEl.hidden=!listEl.hidden;};
if(SONGS.length<2){document.getElementById('prev').style.display='none';document.getElementById('next').style.display='none';}

function repel(p,px,py,R){
  const dx=p.x-px,dy=p.y-py,d2=dx*dx+dy*dy;
  if(d2<R*R){const d=Math.sqrt(d2)+.01;const f=(R-d)/R*14;p.x+=dx/d*f;p.y+=dy/d*f;}
}

function frame(ms){
  const tm=ms*0.001;
  let bass=0;
  if(analyser&&!audio.paused){
    analyser.getByteFrequencyData(bins);
    let s=0;for(let i=1;i<7;i++)s+=bins[i];
    bass=s/6/255;
  }
  energy+=(bass-energy)*0.25;
  const pulse=energy>0.02?energy*energy:0.25*Math.pow(Math.max(0,Math.sin(tm*4)),4);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.30)';ctx.fillRect(0,0,vw,vh);
  ctx.globalCompositeOperation='lighter';

  for(const s of stars){
    ctx.fillStyle=`rgba(255,200,225,${.1+.18*Math.sin(tm*2+s.o)})`;
    ctx.fillRect(s.x*vw,s.y*vh,s.s,s.s);
  }
  // shooting stars (several, both directions)
  if(shoots.length<5&&rnd()<.03){
    const dir=rnd()<.5?1:-1;
    shoots.push({x:dir>0?rnd()*vw*.5:vw*.5+rnd()*vw*.5,y:rnd()*vh*.4,vx:dir*(9+rnd()*7),vy:4+rnd()*5,l:0,max:45+rnd()*30,c:rnd()<.5?'255,200,230':'190,220,255'});
  }
  for(let i=shoots.length-1;i>=0;i--){
    const q=shoots[i];q.x+=q.vx;q.y+=q.vy;q.l++;
    const f=1-q.l/q.max;
    if(f<=0){shoots.splice(i,1);continue;}
    ctx.lineCap='round';
    ctx.strokeStyle=`rgba(${q.c},${.7*f})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*7,q.y-q.vy*7);ctx.stroke();
    ctx.strokeStyle=`rgba(${q.c},${.18*f})`;ctx.lineWidth=6;
    ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*5,q.y-q.vy*5);ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${f})`;ctx.fillRect(q.x-1.5,q.y-1.5,3,3);
  }

  // floating hearts
  if(rnd()<.10+pulse*.5)spawnHeart(rnd()*vw,vh+10,false);
  for(let i=hearts.length-1;i>=0;i--){
    const h=hearts[i];
    h.l++;h.x+=h.vx+Math.sin(tm*1.5+h.o)*.5;h.y+=h.vy;
    h.vx*=.985;
    const a=Math.min(1,h.l/20)*Math.max(0,Math.min(1,h.y/(vh*.25)));
    if(h.y<-20||a<=0.01){hearts.splice(i,1);continue;}
    ctx.fillStyle=h.hue<.5?`rgba(255,80,140,${.55*a})`:`rgba(255,150,190,${.5*a})`;
    miniHeart(h.x,h.y,h.s);
    ctx.fillStyle=`rgba(255,80,140,${.10*a})`;
    miniHeart(h.x,h.y,h.s*1.7);
  }

  // soft glows behind photo and heart
  {
    let cx=pox+IW*ps/2,cy=poy+IH*ps/2,r=Math.max(IW,IH)*ps*.75;
    let gr=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    gr.addColorStop(0,'rgba(40,100,255,'+(.12+pulse*.1)+')');gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr;ctx.fillRect(cx-r,cy-r,2*r,2*r);
    cx=hox+CX*hs;cy=hoy+(CY-20)*hs;r=330*hs;
    gr=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    gr.addColorStop(0,'rgba(255,50,120,'+(.12+pulse*.15)+')');gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr;ctx.fillRect(cx-r,cy-r,2*r,2*r);
  }
  // twinkling sparkles
  for(const k of sparkles){
    const a=Math.pow(Math.max(0,Math.sin(tm*1.4+k.o)),4);
    if(a<.02)continue;
    ctx.fillStyle=`rgba(255,235,245,${a})`;
    const x=k.x*vw,y=k.y*vh,z=k.s*(.6+a);
    ctx.fillRect(x-z,y-.6,2*z,1.2);ctx.fillRect(x-.6,y-z,1.2,2*z);
  }

  // photo, top right (blue dots), breathes with the beat
  const bk=1+pulse*.03,ps2=ps*bk,pox2=pox-IW*ps*(bk-1)/2,poy2=poy-IH*ps*(bk-1)/2;
  ctx.setTransform(dpr*ps2,0,0,dpr*ps2,dpr*pox2,dpr*poy2);
  {
    const px=(sx-pox)/ps,py=(sy-poy)/ps,R=55/ps;
    for(let i=0;i<P.length;i++){
      const p=P[i];
      const tx=p.bx+Math.sin(tm*1.3+p.o)*1.5,ty=p.by+Math.cos(tm*1.1+p.o)*1.5;
      repel(p,px,py,R);
      p.x+=(tx-p.x)*0.06;p.y+=(ty-p.y)*0.06;
      const tw=.75+.25*Math.sin(tm*2.5+p.o);
      const a=Math.min(1,(.35+.5*p.b)*tw+pulse*.4);
      ctx.fillStyle=`rgba(${(30+110*p.b)|0},${(90+120*p.b)|0},255,${a})`;
      ctx.fillRect(p.x,p.y,2.3,2.3);
      if(p.h){ctx.fillStyle=`rgba(60,130,255,${.07+pulse*.08})`;ctx.fillRect(p.x-4,p.y-4,10,10);}
    }
  }

  // heart, bottom middle (pink) with the message
  ctx.setTransform(dpr*hs,0,0,dpr*hs,dpr*hox,dpr*hoy);
  {
    const px=(sx-hox)/hs,py=(sy-hoy)/hs,R=55/hs;
    const beat=1+0.03*pulse*4+0.012*Math.sin(tm*3);
    for(let i=0;i<F.length;i++){
      const p=F[i];
      const tx=CX+(p.bx-CX)*beat+Math.sin(tm*1.2+p.o)*2,ty=CY+(p.by-CY)*beat+Math.cos(tm*1.0+p.o)*2;
      repel(p,px,py,R);
      p.x+=(tx-p.x)*0.06;p.y+=(ty-p.y)*0.06;
      ctx.fillStyle=`rgba(255,90,150,${.28+.12*Math.sin(tm*2+p.o)+pulse*.2})`;
      ctx.fillRect(p.x,p.y,1.8,1.8);
    }
    for(let i=0;i<E.length;i++){
      const p=E[i];
      p.t=(p.t+p.sp*(1+energy*3)+720)%720;
      const q=HP[p.t|0];
      const tx=CX+(q.x-CX)*p.k*beat,ty=CY+(q.y-CY)*p.k*beat;
      repel(p,px,py,R);
      p.x+=(tx-p.x)*0.12;p.y+=(ty-p.y)*0.12;
      const tw=.6+.4*Math.sin(tm*4+p.o);
      ctx.fillStyle=`rgba(255,${(70+90*p.u)|0},${(140+70*p.u)|0},${.6*tw+pulse*.3})`;
      ctx.fillRect(p.x,p.y,2.2,2.2);
      if(i%5===0){ctx.fillStyle='rgba(255,70,140,.10)';ctx.fillRect(p.x-3,p.y-3,8,8);}
    }
    for(let i=0;i<T.length;i++){
      const p=T[i];
      p.x+=(p.bx-p.x)*0.06;p.y+=(p.by-p.y)*0.06;
      ctx.fillStyle=`rgba(255,235,245,${.85+.15*Math.sin(tm*3+p.o)})`;
      ctx.fillRect(p.x+Math.sin(tm*3+p.o)*.6,p.y+Math.cos(tm*3+p.o)*.6,1.7,1.7);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
